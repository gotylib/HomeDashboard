name: Docker

on:
  push:
    branches:
      - prom

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: homedashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME is missing or empty. Add it in repo Settings → Secrets."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN is missing or empty. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "IMAGE=${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Read release version
        id: version
        run: |
          set -a
          # shellcheck disable=SC1091
          source version.env
          set +a
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag current latest as release version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker pull "${IMAGE}:latest"; then
            docker tag "${IMAGE}:latest" "${IMAGE}:v${VERSION}"
            docker push "${IMAGE}:v${VERSION}"
          else
            echo "No existing latest image — skipping version tag."
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
