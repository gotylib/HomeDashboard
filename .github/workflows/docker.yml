name: Docker

on:
  push:
    branches:
      - prom

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: homedashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image name and login
        id: meta
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          USER="$(printf '%s' "$RAW_USER" | tr -d '\r\n' | xargs)"
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | xargs)"

          if [ -z "$USER" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME is missing or empty."
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN is missing or empty."
            exit 1
          fi

          IMAGE="${USER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Prepared image ${IMAGE}"

          echo "$TOKEN" | docker login -u "$USER" --password-stdin

      - name: Read release version
        id: version
        run: |
          set -a
          # shellcheck disable=SC1091
          source version.env
          set +a
          VERSION="$(printf '%s' "$VERSION" | tr -d '\r\n' | xargs)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag current latest as release version
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker pull "${IMAGE}:latest"; then
            docker tag "${IMAGE}:latest" "${IMAGE}:v${VERSION}"
            docker push "${IMAGE}:v${VERSION}"
          else
            echo "No existing latest image — skipping version tag."
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
